<style>
/* ════════════════════════════════════════════════════════════
   Maxence Cerfontaine — v4 « fiche technique »
   Papier chaud · encre · un seul vert · typographie éditoriale
   ════════════════════════════════════════════════════════════ */
:root{
  --paper:#F4F2EB; --paper2:#EDEAE0; --card:#FBFAF6;
  --ink:#1C1B15; --ink2:#454336; --mut:#7C7A6B; --faint:#A6A493;
  --rule:#D8D4C4; --rule2:#BEB9A5;
  --green:#28603C; --green2:#3E7A4C; --green-bg:#E4EBE0;
  --rust:#9A5B2D;
  --disp:"Fraunces",Georgia,serif;
  --sans:"Archivo",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.62;font-size:15.5px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 28px}
a{color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:var(--green);color:var(--paper)}
.mlabel{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--mut)}
.mnum{font-family:var(--mono);font-size:11.5px;color:var(--rust)}

/* ── nav ── */
nav{position:sticky;top:0;z-index:50;background:rgba(244,242,235,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
nav .wrap{display:flex;justify-content:space-between;height:60px;align-items:center;gap:16px}
.brand{text-decoration:none;font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.brand span{color:var(--green)}
.nav-r{display:flex;align-items:center;gap:26px}
.nav-links{display:flex;gap:22px;list-style:none}
.nav-links a{font-size:13.5px;color:var(--ink2);text-decoration:none;padding-bottom:2px;border-bottom:1px solid transparent}
.nav-links a:hover{border-bottom-color:var(--green);color:var(--green)}
.lang{font-family:var(--mono);font-size:12px;display:flex;gap:3px;color:var(--faint)}
.lang button{color:var(--faint);padding:2px 3px}
.lang button.on{color:var(--ink);border-bottom:2px solid var(--green)}
.lang button:not(.on):hover{color:var(--ink2)}

/* ── hero ── */
header{padding:66px 0 56px;border-bottom:1px solid var(--rule)}
.hero{display:grid;grid-template-columns:1.5fr .9fr;gap:56px;align-items:start}
.crumb{font-family:var(--mono);font-size:12px;color:var(--mut);margin-bottom:26px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.crumb .sep{color:var(--rule2)}
.crumb .ok{color:var(--green)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green)}
h1{font-family:var(--disp);font-weight:470;font-size:clamp(40px,6vw,64px);line-height:1.02;letter-spacing:-.015em;margin-bottom:22px}
h1 em{font-style:italic;color:var(--green)}
.lede{font-size:16.5px;color:var(--ink2);max-width:56ch;margin-bottom:32px}
.hactions{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;font-size:14px;font-weight:600;padding:12px 22px;border-radius:2px;transition:background .15s}
.btn:hover{background:var(--green)}
.tlink{font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--rule2);padding-bottom:2px;transition:.15s}
.tlink:hover{border-bottom-color:var(--green);color:var(--green)}
.fiche{border-top:2px solid var(--ink);padding-top:14px}
.fiche .mlabel{display:block;margin-bottom:10px;text-transform:uppercase;letter-spacing:.12em}
.frow{display:flex;justify-content:space-between;gap:14px;padding:7.5px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.frow:last-child{border-bottom:none}
.frow span{color:var(--mut)}
.frow b{font-weight:600;text-align:right}

/* ── sections ── */
section{padding:54px 0;border-bottom:1px solid var(--rule)}
.shead{display:flex;align-items:baseline;gap:18px;margin-bottom:8px}
.shead h2{font-family:var(--disp);font-weight:500;font-size:31px;letter-spacing:-.01em}
.ssub{font-size:13.5px;color:var(--mut);margin-bottom:30px;max-width:70ch}

/* ── tabs ── */
.tabbar{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule2);margin-bottom:30px;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:26px}
.tabs button{font-size:14px;font-weight:500;color:var(--mut);padding:0 2px 10px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--green);font-weight:600}
.tabs button:not(.on):hover{color:var(--ink2)}
.xall{font-family:var(--mono);font-size:12px;color:var(--green);padding:0 2px 10px}
.xall:hover{text-decoration:underline}
.view{display:none}
.view.on{display:block;animation:vf .22s ease}
@keyframes vf{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ── vue schéma ── */
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.legend .mlabel{margin-right:4px}
.lgd{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:var(--mut);border:1px solid var(--rule2);background:var(--card);padding:5px 11px;border-radius:2px;transition:.14s}
.lgd svg{width:13px;height:13px;display:block}
.lgd:hover{border-color:var(--ink);color:var(--ink)}
.lgd.on{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.region{border:1px dashed var(--rule2);padding:34px 18px 18px;position:relative;background:var(--card)}
.region-lbl{position:absolute;top:-9px;left:16px;background:var(--paper);padding:0 9px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--mut)}
.vpc{border:1px solid var(--rule2);padding:30px 14px 16px;position:relative;margin-bottom:20px;background:var(--paper)}
.vpc:last-child{margin-bottom:0}
.vpc-lbl{position:absolute;top:-10px;left:14px;background:var(--ink);color:var(--paper);padding:1px 10px;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.vpc-meta{position:absolute;top:-8px;right:14px;background:var(--paper);padding:0 8px;font-family:var(--mono);font-size:10.5px;color:var(--mut)}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.svc{background:var(--card);border:1px solid var(--rule2);padding:13px 14px;text-align:left;transition:.14s;position:relative}
.svc:hover{border-color:var(--ink);transform:translateY(-1px)}
.svc.on{border-color:var(--green);background:var(--green-bg)}
.svc.on::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--green)}
.svc-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ico{width:22px;height:22px;display:grid;place-items:center;flex-shrink:0}
.ico svg{width:19px;height:19px;display:block}
.svc-n{font-size:14px;font-weight:600;line-height:1.25;letter-spacing:-.005em}
.svc-r{font-family:var(--mono);font-size:11px;color:var(--green);margin-bottom:2px}
.svc-d{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
.svc-tag{font-size:12.5px;color:var(--ink2);line-height:1.45;margin-top:7px}
.svc-live{font-family:var(--mono);font-size:9.5px;color:var(--rust);text-transform:uppercase;letter-spacing:.1em;margin-top:6px}
.inline-detail{grid-column:1/-1;border-left:3px solid var(--green);background:var(--card);border-top:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:20px 24px;animation:vf .2s ease}

/* ── détail commun ── */
.dt-h{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.dt-h h3{font-family:var(--disp);font-size:20px;font-weight:520;letter-spacing:-.005em}
.dt-when{font-family:var(--mono);font-size:11.5px;color:var(--rust);padding-top:6px;white-space:nowrap}
.dt-role{font-family:var(--mono);font-size:12px;color:var(--green);margin-bottom:14px}
.dt-intro{font-size:14.5px;color:var(--ink2);margin-bottom:13px;max-width:78ch}
.dt ul,.inline-detail ul{list-style:none;margin-bottom:13px}
.dt li,.inline-detail li{position:relative;padding-left:18px;margin-bottom:7px;font-size:14.5px;color:var(--ink2)}
.dt li::before,.inline-detail li::before{content:"—";position:absolute;left:0;color:var(--green)}
.stackline{font-family:var(--mono);font-size:11.5px;color:var(--mut);line-height:1.8}
.stackline b{color:var(--ink2);font-weight:500}

/* ── chronologie par employeur ── */
.emp{border:1px solid var(--rule2);background:var(--card);margin-bottom:26px}
.emp:last-child{margin-bottom:0}
.emp-head{width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:20px 24px;text-align:left}
.emp-head:hover .emp-n{color:var(--green)}
.emp-n{display:block;font-family:var(--disp);font-size:23px;font-weight:520;letter-spacing:-.008em;transition:color .15s}
.emp-sub{display:block;font-family:var(--mono);font-size:11.5px;color:var(--mut);margin-top:3px}
.emp-sub .rl{color:var(--green)}
.emp-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.emp-when{font-family:var(--mono);font-size:11.5px;color:var(--rust);white-space:nowrap;display:block}
.emp-x{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--rule2);border-radius:50%;background:var(--paper);
  font-family:var(--mono);font-size:22px;line-height:1;color:var(--mut);
  transition:transform .18s,color .15s,border-color .15s,background .15s}
.emp-head:hover .emp-x{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.emp.on .emp-x{transform:rotate(45deg);color:var(--green);border-color:var(--green);background:var(--green-bg)}
.emp-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.emp-body-in{padding:0 24px 20px;border-bottom:1px dashed var(--rule)}
.emp-body-in .dt-intro{border-left:2px solid var(--green-bg);padding-left:14px}
.emp-missions{padding:16px 24px 22px 24px}
.emp-missions .mlabel{display:block;text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}
.entry{position:relative;padding-left:30px;margin-bottom:6px}
.entry:last-child{margin-bottom:0}
.entry::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--rule2)}
.entry::after{content:"";position:absolute;left:8px;top:23px;width:16px;height:1px;background:var(--rule2)}
.entry:last-child::before{bottom:auto;height:23px}
.e-card{border:1px solid transparent;transition:.14s;background:var(--paper)}
.e-card:hover{border-color:var(--rule)}
.e-card.on{border-color:var(--rule2)}
.e-btn{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:10px 14px;text-align:left}
.e-when{font-family:var(--mono);font-size:11px;color:var(--rust);display:block;margin-bottom:2px}
.e-t{font-size:15.5px;font-weight:600;letter-spacing:-.005em;display:block}
.e-c{font-family:var(--mono);font-size:11px;color:var(--mut);display:block;margin-top:1px}
.e-logo{width:26px;height:26px;border:1px solid var(--rule);background:var(--card);display:grid;place-items:center;flex-shrink:0;margin-top:3px}
.e-logo svg{width:15px;height:15px;display:block}
.e-txt{flex:1;min-width:0}
.e-x{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:50%;background:var(--card);
  font-family:var(--mono);font-size:18px;line-height:1;color:var(--mut);flex-shrink:0;
  transition:transform .18s,color .15s,border-color .15s,background .15s}
.e-btn:hover .e-x{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.e-card.on .e-x{transform:rotate(45deg);color:var(--green);border-color:var(--green);background:var(--green-bg)}
.e-body{max-height:0;overflow:hidden;transition:max-height .26s ease}
.e-body-in{margin:0 14px 14px;padding:14px 0 0 18px;border-left:2px solid var(--green-bg);border-top:1px dashed var(--rule)}

/* ── compétences ── */
.skrow{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--rule)}
.skrow:last-child{border-bottom:none}
.skrow dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding-top:3px}
.skrow dd .main{font-size:15px;font-weight:500}
.skrow dd .main b{font-weight:600}
.skrow dd .lvl{font-family:var(--mono);font-size:11px;color:var(--faint)}
.skitem{margin-bottom:6px}
.skitem:last-child{margin-bottom:0}
.skinline{font-size:14.5px;color:var(--ink2)}

/* ── certifications ── */
.certcols{columns:2;column-gap:52px}
.crow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule);break-inside:avoid}
.crow .clogo{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:3px}
.crow .clogo svg{width:18px;height:18px;display:block}
.crow .cn{min-width:0}
.crow .nm{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.005em;line-height:1.3}
.crow .lv{display:block;font-family:var(--mono);font-size:11px;color:var(--mut)}
.crow .sp{flex:1;height:14px;border-bottom:1px dotted var(--rule2);min-width:18px}
.crow a.vf{font-family:var(--mono);font-size:11.5px;color:var(--green);text-decoration:none;white-space:nowrap;padding-top:1px}
.crow a.vf:hover{text-decoration:underline}
.crow .vn{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;padding-top:2px}

/* ── formation ── */
.edrow{display:grid;grid-template-columns:200px 1fr auto;gap:20px;padding:15px 0;border-bottom:1px solid var(--rule)}
.edrow:last-child{border-bottom:none}
.edrow .y{font-family:var(--mono);font-size:12px;color:var(--rust);padding-top:2px}
.edrow h4{font-size:16px;font-weight:600;letter-spacing:-.005em}
.edrow p{font-size:13.5px;color:var(--mut)}
.edlogo{align-self:center;display:flex;justify-content:flex-end}
/* multiply : fond blanc des logos fournis en PNG fondu dans le papier ;
   largeur fixée par CONFIG.edu pour une taille commune */
.edlogo img{display:block;height:auto;mix-blend-mode:multiply}

/* ── contact ── */
.contact h3{font-family:var(--disp);font-weight:470;font-size:clamp(28px,4vw,42px);letter-spacing:-.01em;margin-bottom:10px}
.contact h3 em{font-style:italic;color:var(--green)}
.contact p{color:var(--mut);margin-bottom:26px;max-width:52ch}
.contact .big{font-family:var(--disp);font-size:clamp(19px,2.6vw,26px);font-weight:500;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--rule2);transition:.15s}
.contact .big:hover{border-bottom-color:var(--green);color:var(--green)}
footer{border-top:1px solid var(--rule);padding:22px 0 34px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--faint)}

@media(max-width:720px){
  .nav-links{display:none}
  .hero{grid-template-columns:1fr;gap:34px}
  .emp-head{flex-direction:column;gap:6px}
  .emp-right{text-align:left;flex-direction:row;align-items:center;align-self:stretch;justify-content:space-between;width:100%}
  .emp-missions{padding:14px 14px 18px}
  .certcols{columns:1}
  .skrow,.edrow{grid-template-columns:1fr;gap:6px}
  .edlogo{justify-content:flex-start;margin-top:8px}
}
/* étroit : l'étiquette employeur et la période se chevauchaient sur la
   bordure haute du bloc — la période repasse dans le flux, sous l'étiquette. */
@media(max-width:560px){
  .vpc{padding-top:22px}
  .vpc-meta{position:static;display:block;background:none;padding:0;margin-bottom:12px}
}
</style>
</head>

<nav><div class="wrap">
  <a class="brand" href="#top">Maxence <span>Cerfontaine</span></a>
  <div class="nav-r">
    <ul class="nav-links">
      <li><a href="#parcours" data-t="nav_exp"></a></li>
      <li><a href="#skills" data-t="nav_skills"></a></li>
      <li><a href="#certs" data-t="nav_certs"></a></li>
      <li><a href="#edu" data-t="nav_edu"></a></li>
      <li><a href="#contact" data-t="nav_contact"></a></li>

    <div class="lang"><button id="btn-fr" onclick="setLang('fr')">🇫🇷 FR</button><span>/</span><button id="btn-en" onclick="setLang('en')">🇬🇧 EN</button></div>
  </div>
</div></nav>

<div class="wrap" id="top">
<header>
  <div class="hero">
    <div>
      <div class="crumb"><span class="dot"></span><span class="ok" data-t="crumb_status"></span><span class="sep">/</span><span data-t="crumb_loc"></span><span class="sep">/</span><span>AWS · GCP · Azure</span></div>
      <h1 data-t="h1" data-html="1"></h1>
      <p class="lede" data-t="lede"></p>
      <div class="hactions">
        <a class="btn" id="cv-main" href="#" download data-t="cv_btn"></a>
        <a class="tlink" id="cv-alt" href="#" download data-t="cv_alt"></a>
        <a class="tlink" href="#contact" data-t="contact_btn"></a>
      </div>
    </div>
    <aside class="fiche">
      <span class="mlabel" data-t="fiche"></span>
      <div class="frow"><span data-t="f1"></span><b data-t="f1v"></b></div>
      <div class="frow"><span data-t="f2"></span><b>Paris, France</b></div>
      <div class="frow"><span data-t="f3"></span><b>AWS · GCP · Azure</b></div>
      <div class="frow"><span data-t="f4"></span><b data-t="f4v"></b></div>
      <div class="frow"><span data-t="f5"></span><b>TOEIC 930/990</b></div>
    </aside>
  </div>
</header>

<section id="parcours">
  <div class="shead"><span class="mnum">01</span><h2 data-t="s1"></h2></div>
  <p class="ssub" data-t="s1_sub"></p>
  <div class="tabbar">
    <div class="tabs">
      <button id="tab-arch" class="on" onclick="setView('arch')" data-t="tab_arch"></button>
      <button id="tab-chrono" onclick="setView('chrono')" data-t="tab_chrono"></button>
    </div>
    <button class="xall" id="xall" onclick="toggleAll()" style="display:none"></button>
  </div>
  <div class="view on" id="view-arch">
    <div class="legend" id="legend"></div>
    <div class="region">
      <span class="region-lbl" data-t="region"></span>
      <div id="arch-root"></div>
    </div>
  </div>
  <div class="view" id="view-chrono"><div id="tl-root"></div></div>
</section>

<section id="skills">
  <div class="shead"><span class="mnum">02</span><h2 data-t="s_sk"></h2></div>

const t=k=>CONFIG.ui[LANG][k]||'';
LOGOS.multi=LOGOS.oth;

/* durée depuis une date "YYYY-MM", comptée en mois inclusifs
   (mar 2024 → mar 2026 = « 2 ans 1 mois ») — l'affichage du poste
   en cours reste juste sans retoucher le CONFIG chaque mois. */
function dur(since){
  const [y,m]=since.split('-').map(Number), now=new Date();
  let n=(now.getFullYear()-y)*12+now.getMonth()+1-m+1;
  if(n<1)n=1;
  const yr=Math.floor(n/12), mo=n%12, fr=LANG==='fr', out=[];
  if(yr)out.push(yr+(fr?(yr>1?' ans':' an'):(yr>1?' yrs':' yr')));
  if(mo)out.push(mo+(fr?' mois':(mo>1?' mos':' mo')));
  return out.join(' ');
}
const whenStr=o=>pick(o.when)+(o.since?' · '+dur(o.since):'');

function renderStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const v=t(el.dataset.t);
    if(el.dataset.html)el.innerHTML=v;else el.textContent=v;
  });
  $('#cv-main').href=LANG==='fr'?CONFIG.cv.fr:CONFIG.cv.en;
  $('#cv-alt').href=LANG==='fr'?CONFIG.cv.en:CONFIG.cv.fr;
  $('#btn-fr').classList.toggle('on',LANG==='fr');
  $('#btn-en').classList.toggle('on',LANG==='en');
  renderLegend();
  updateXall();
}

function stackHTML(o){return `<div class="stackline"><b>${t('env_lbl')}</b> — ${o.stack}</div>`;}
function detailHTML(o){
  return `<div class="dt-h"><h3>${pick(o.title)}</h3><span class="dt-when">${whenStr(o)}</span></div>
    <div class="dt-role">${pick(o.role)}</div>
    ${o.intro?`<p class="dt-intro">${pick(o.intro)}</p>`:''}
    <ul>${o.bullets[LANG].map(b=>`<li>${b}</li>`).join('')}</ul>${stackHTML(o)}`;
}

/* ── filtre par techno du schéma ── */
let ARCHFILTER=null;
function renderLegend(){
  const lg=$('#legend');lg.innerHTML=`<span class="mlabel">${t('filter_lbl')}</span>`;
  [['aws','AWS'],['gcp','GCP'],['az','Azure'],['multi',LANG==='fr'?'Général':'General']].forEach(([c,label])=>{
    const b=document.createElement('button');
    b.className='lgd'+(ARCHFILTER===c?' on':'');
    b.innerHTML=`${LOGOS[c]}${label}`;
    b.addEventListener('click',()=>{ARCHFILTER=(ARCHFILTER===c)?null:c;applyArchFilter();renderLegend();});
    lg.appendChild(b);
  });
}
function applyArchFilter(){
  document.querySelectorAll('.inline-detail').forEach(x=>x.remove());
  document.querySelectorAll('.svc').forEach(sv=>{
    sv.classList.remove('on');
    sv.style.display=(!ARCHFILTER||sv.dataset.cloud===ARCHFILTER)?'':'none';
  });
  document.querySelectorAll('.vpc').forEach(v=>{
    const any=[...v.querySelectorAll('.svc')].some(sv=>sv.style.display!=='none');
    v.style.display=any?'':'none';
  });
}

/* ── schéma ── */
function renderArch(){
  const root=$('#arch-root');root.innerHTML='';
  CONFIG.companies.forEach(co=>{
    const vpc=document.createElement('div');vpc.className='vpc';
    vpc.innerHTML=`<span class="vpc-lbl">${co.name}</span><span class="vpc-meta">${whenStr(co)}</span>`;
    const grid=document.createElement('div');grid.className='svcs';
    const items=[];
    if(co.coreCard){
      items.push({obj:{title:{fr:pick2(co.coreCard.card,'fr'),en:pick2(co.coreCard.card,'en')},when:co.when,since:co.since,role:co.role,intro:co.intro,bullets:co.bullets,stack:co.stack},
                  card:co.coreCard.card,role:co.role,sub:co.coreCard.sub,tag:co.coreCard.tag,cloud:co.coreCard.cloud,live:false});
    }
    CONFIG.missions.filter(m=>m.company===co.id).forEach(m=>items.push({obj:m,card:m.card,role:m.role,sub:m.sub,tag:m.tag,cloud:m.cloud,live:m.live}));
    items.forEach(it=>{
      const b=document.createElement('button');b.className='svc';b.dataset.cloud=it.cloud;
      b.innerHTML=`<div class="svc-top"><span class="ico">${LOGOS[it.cloud]||LOGOS.oth}</span>
        <span class="svc-n">${pick(it.card)}</span></div>
        <div class="svc-r">${pick(it.role)}</div><div class="svc-d">${pick(it.sub)}</div>
        ${it.tag?`<div class="svc-tag">${pick(it.tag)}</div>`:''}
        ${it.live?`<div class="svc-live">● ${t('current')}</div>`:''}`;
      b.addEventListener('click',()=>{
        const was=b.classList.contains('on');
        document.querySelectorAll('.svc').forEach(x=>x.classList.remove('on'));
        document.querySelectorAll('.inline-detail').forEach(x=>x.remove());
        if(was)return;
        b.classList.add('on');
        const d=document.createElement('div');d.className='inline-detail';d.innerHTML=detailHTML(it.obj);
        b.after(d);d.scrollIntoView({behavior:'smooth',block:'nearest'});
      });
      grid.appendChild(b);
    });
    vpc.appendChild(grid);root.appendChild(vpc);
  });
  applyArchFilter();
}
function pick2(v,l){return (v&&typeof v==='object'&&!Array.isArray(v))?v[l]:v;}

/* ── dépliage animé ──
   Une fois ouvert, le bloc repasse en max-height:none : il suit alors les
   reflows (resize, chargement des polices, onglet masqué) sans recalcul. */
function initBody(el,open){
  el.dataset.open=open?'1':'0';
  el.style.maxHeight=open?'none':'0px';
  el.addEventListener('transitionend',ev=>{
    if(ev.target===el&&ev.propertyName==='max-height'&&el.dataset.open==='1')el.style.maxHeight='none';
  });
}
function setBody(el,open){
  if(el.dataset.open===(open?'1':'0'))return;
  if(open){el.dataset.open='1';el.style.maxHeight=el.scrollHeight+'px';return;}
  el.style.maxHeight=el.scrollHeight+'px';   /* fige la hauteur avant l'animation */
  void el.offsetHeight;
  el.dataset.open='0';
  requestAnimationFrame(()=>{if(el.dataset.open==='0')el.style.maxHeight='0px';});
}

/* ── chronologie par employeur ── */
function renderChrono(){
  const root=$('#tl-root');root.innerHTML='';
  CONFIG.companies.forEach(co=>{
    const emp=document.createElement('div');emp.className='emp';
    emp.innerHTML=`<button class="emp-head" aria-expanded="true">
        <span><span class="emp-n">${co.name}</span>
          <span class="emp-sub"><span class="rl">${pick(co.role)}</span> · ${pick(co.contract)} · ${pick(co.loc)}</span></span>
        <span class="emp-right"><span class="emp-when">${whenStr(co)}</span><span class="emp-x">+</span></span>
      </button>
      <div class="emp-body"><div class="emp-body-in dt">
        <p class="dt-intro">${pick(co.intro)}</p>
        <ul>${co.bullets[LANG].map(b=>`<li>${b}</li>`).join('')}</ul>
        ${stackHTML(co)}
      </div></div>`;
    /* le poste lui-même (intro + missions du poste) est déplié d'entrée :
       c'est le contenu principal, les missions clients restent repliées. */
    const body=emp.querySelector('.emp-body'), head=emp.querySelector('.emp-head');
    emp.classList.add('on');
    initBody(body,true);
    head.addEventListener('click',()=>{
      const open=!emp.classList.contains('on');
      emp.classList.toggle('on',open);
      head.setAttribute('aria-expanded',open);
      setBody(body,open);
      syncXall();
    });
    const ms=CONFIG.missions.filter(m=>m.company===co.id);
    if(ms.length){
      const zone=document.createElement('div');zone.className='emp-missions';
      zone.innerHTML=`<span class="mlabel">${t('missions_lbl')}</span>`;
      ms.forEach(m=>{
        const e=document.createElement('div');e.className='entry';
        const card=document.createElement('div');card.className='e-card';
        card.innerHTML=`<button class="e-btn" aria-expanded="false"><span class="e-logo">${LOGOS[m.cloud]||LOGOS.oth}</span><span class="e-txt">
            <span class="e-when">${whenStr(m)}</span>
            <span class="e-t">${pick(m.title)}</span>
            <span class="e-c">${pick(m.role)}</span>
          </span><span class="e-x">+</span></button>
          <div class="e-body"><div class="e-body-in dt">
            ${m.intro?`<p class="dt-intro">${pick(m.intro)}</p>`:''}
            <ul>${m.bullets[LANG].map(b=>`<li>${b}</li>`).join('')}</ul>${stackHTML(m)}
          </div></div>`;
        const bd=card.querySelector('.e-body'), btn=card.querySelector('.e-btn');
        initBody(bd,false);
        btn.addEventListener('click',()=>{
          const open=!card.classList.contains('on');
          card.classList.toggle('on',open);
          btn.setAttribute('aria-expanded',open);
          setBody(bd,open);
          syncXall();
        });
        e.appendChild(card);zone.appendChild(e);
      });
      emp.appendChild(zone);
    }
    root.appendChild(emp);
  });
}

/* ── tout déplier ── */
function updateXall(){$('#xall').textContent=ALLOPEN?t('xall_close'):t('xall_open');}
function syncXall(){
  const all=[...document.querySelectorAll('.e-card'),...document.querySelectorAll('.emp')];
  ALLOPEN=all.length>0&&all.every(c=>c.classList.contains('on'));
  updateXall();
}
function toggleAll(){
  ALLOPEN=!ALLOPEN;
  document.querySelectorAll('.emp').forEach(emp=>{
    emp.classList.toggle('on',ALLOPEN);
    emp.querySelector('.emp-head').setAttribute('aria-expanded',ALLOPEN);
    setBody(emp.querySelector('.emp-body'),ALLOPEN);
  });
  document.querySelectorAll('.e-card').forEach(c=>{
    c.classList.toggle('on',ALLOPEN);
    c.querySelector('.e-btn').setAttribute('aria-expanded',ALLOPEN);
    setBody(c.querySelector('.e-body'),ALLOPEN);
  });
  updateXall();
}

/* ── compétences / certifs / formation ── */
function renderSkills(){
  const root=$('#skills-root');root.innerHTML='';
  CONFIG.skills.forEach(s=>{
    const row=document.createElement('div');row.className='skrow';
    let body='';
    if(s.items){body=s.items[LANG].map(([n,l])=>`<div class="skitem"><span class="main"><b>${n}</b></span> <span class="lvl">— ${l}</span></div>`).join('');}
    else{body=`<div class="skinline">${pick(s.inline)}</div>`;}
    row.innerHTML=`<dt>${pick(s.lbl)}</dt><dd>${body}</dd>`;
    root.appendChild(row);
  });
}
function renderCerts(){
  const root=$('#certs-root');root.innerHTML='';
  CONFIG.certs.forEach(c=>{
    const d=document.createElement('div');d.className='crow';
    const link=c.url?`<a class="vf" href="${c.url}" target="_blank" rel="noopener">${t('verify')}</a>`
                    :`<span class="vn">${t('verify_none')}</span>`;
    const who=ISSUER[c.who]||CTXT[c.who]||'';
    d.innerHTML=`<span class="clogo" role="img" aria-label="${who}" title="${who}">${LOGOS[c.who]||LOGOS.oth}</span>
      <span class="cn"><span class="nm">${pick(c.name)}</span><span class="lv">${pick(c.lvl)}</span></span>
      <span class="sp"></span>${link}`;
    root.appendChild(d);
  });
}
function renderEdu(){
  const root=$('#edu-root');root.innerHTML='';
  CONFIG.edu.forEach(e=>{
    const d=document.createElement('div');d.className='edrow';
    const logo=e.logo?`<div class="edlogo"><img src="${e.logo.src}" alt="${e.logo.alt}" style="width:${e.logo.w}px" loading="lazy"></div>`:'<div></div>';
    d.innerHTML=`<div class="y">${pick(e.y)}</div><div><h4>${pick(e.t)}</h4><p>${pick(e.p)}</p></div>${logo}`;
    root.appendChild(d);
  });
}

function setView(v){
  $('#tab-arch').classList.toggle('on',v==='arch');
  $('#tab-chrono').classList.toggle('on',v==='chrono');
  $('#view-arch').classList.toggle('on',v==='arch');
  $('#view-chrono').classList.toggle('on',v==='chrono');
  $('#xall').style.display=v==='chrono'?'block':'none';
}
function setLang(l){
  LANG=l;ALLOPEN=false;
  renderStatic();renderArch();renderChrono();renderSkills();renderCerts();renderEdu();
}
setLang('fr');
