<style>
/* ════════════════════════════════════════════════════════════
   Maxence Cerfontaine — v4 « fiche technique »
   Papier chaud · encre · un seul vert · typographie éditoriale
   ════════════════════════════════════════════════════════════ */
:root{
  --paper:#F4F2EB; --paper2:#EDEAE0; --card:#FBFAF6;
  --ink:#1C1B15; --ink2:#454336; --mut:#7C7A6B; --faint:#A6A493;
  --rule:#D8D4C4; --rule2:#BEB9A5;
  --green:#28603C; --green2:#3E7A4C; --green-bg:#E4EBE0;
  --rust:#9A5B2D;
  --disp:"Fraunces",Georgia,serif;
  --sans:"Archivo",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.62;font-size:15.5px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 28px}
a{color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:4px}
::selection{background:var(--green);color:var(--paper)}
.mlabel{font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--mut)}
.mnum{font-family:var(--mono);font-size:11.5px;color:var(--rust)}
.flag{display:inline-block;width:16px;aspect-ratio:5/3;height:auto;border-radius:2px;vertical-align:-2px;outline:1px solid rgba(28,27,21,.14);outline-offset:-1px}
.flag+.flag{margin-left:3px}
.lang .flag{width:14px;vertical-align:-1.5px}

/* ── nav ── */
nav{position:sticky;top:0;z-index:50;background:rgba(244,242,235,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
nav .wrap{display:flex;justify-content:space-between;height:60px;align-items:center;gap:16px}
.brand{text-decoration:none;font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.brand span{color:var(--green)}
.nav-r{display:flex;align-items:center;gap:20px}
.nav-links{display:flex;gap:22px;list-style:none}
.nav-links a{font-size:13.5px;color:var(--ink2);text-decoration:none;padding-bottom:2px;border-bottom:1px solid transparent}
.nav-links a:hover{border-bottom-color:var(--green);color:var(--green)}
.nav-socials{display:flex;align-items:center;gap:3px}
.nav-social{display:grid;place-items:center;width:32px;height:32px;border:1px solid transparent;border-radius:50%;color:var(--mut);text-decoration:none;transition:color .15s,background .15s,border-color .15s,transform .15s}
.nav-social svg{display:block;width:16px;height:16px;fill:currentColor}
.nav-social:hover{color:var(--green);background:var(--green-bg);border-color:var(--rule2);transform:translateY(-1px)}
.nav-social:active{transform:translateY(0)}
.lang{font-family:var(--mono);font-size:12px;display:flex;gap:3px;color:var(--faint)}
.lang button{color:var(--faint);padding:2px 3px}
.lang button.on{color:var(--ink);border-bottom:2px solid var(--green)}
.lang button:not(.on):hover{color:var(--ink2)}

/* ── hero ── */
header{padding:66px 0 56px;border-bottom:1px solid var(--rule)}
.hero{display:grid;grid-template-columns:1.5fr .9fr;gap:56px;align-items:start}
.crumb{font-family:var(--mono);font-size:12px;color:var(--mut);margin-bottom:26px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.crumb .sep{color:var(--rule2)}
.crumb .ok{color:var(--green)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green)}
h1{font-family:var(--disp);font-weight:470;font-size:clamp(40px,6vw,64px);line-height:1.02;letter-spacing:-.015em;margin-bottom:22px}
h1 em{font-style:italic;color:var(--green)}
.lede{font-size:16.5px;color:var(--ink2);max-width:56ch;margin-bottom:32px}
.hactions{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.btn{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;font-size:14px;font-weight:600;padding:12px 22px;border-radius:2px;transition:background .15s}
.btn:hover{background:var(--green)}
.tlink{font-size:14px;font-weight:500;color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--rule2);padding-bottom:2px;transition:.15s}
.tlink:hover{border-bottom-color:var(--green);color:var(--green)}
.fiche{border-top:2px solid var(--ink);padding-top:14px}
.fiche .mlabel{display:block;margin-bottom:10px;text-transform:uppercase;letter-spacing:.12em}
.frow{display:flex;justify-content:space-between;gap:14px;padding:7.5px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.frow:last-child{border-bottom:none}
.frow span{color:var(--mut)}
.frow b{font-weight:600;text-align:right}

/* ── sections ── */
section{padding:54px 0;border-bottom:1px solid var(--rule)}
.shead{display:flex;align-items:baseline;gap:18px;margin-bottom:8px}
.shead h2{font-family:var(--disp);font-weight:500;font-size:31px;letter-spacing:-.01em}
.ssub{font-size:13.5px;color:var(--mut);margin-bottom:30px;max-width:70ch}

/* ── tabs ── */
.tabbar{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule2);margin-bottom:30px;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:7px}
.tabs button{font-size:14px;font-weight:600;color:var(--mut);padding:9px 13px;border:1px solid var(--rule2);background:var(--card);margin-bottom:-1px;transition:color .16s,background .16s,border-color .16s,transform .16s}
.tabs button.on{color:var(--paper);background:var(--green);border-color:var(--green)}
.tabs button:not(.on):hover{color:var(--green);background:var(--green-bg);border-color:var(--green);transform:translateY(-1px)}
.tabs button:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.xall{font-family:var(--mono);font-size:12px;color:var(--green);padding:9px 2px;margin-bottom:-1px}
.xall:hover{text-decoration:underline}
.view{display:none}
.view.on{display:block;animation:vf .22s ease}
@keyframes vf{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ── schéma vertical du parcours ── */
.arch-intro{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.arch-hint{font-size:13px;color:var(--mut);max-width:68ch}
.arch-direction{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--green);border:1px solid var(--green);background:var(--green-bg);padding:6px 10px;white-space:nowrap}
.arch-canvas{position:relative;border:1px solid var(--rule2);background:var(--card);padding:28px 18px;overflow:hidden}
.arch-wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.arch-wire{fill:none;vector-effect:non-scaling-stroke}
.arch-wire-main{stroke:var(--green);stroke-width:1.8}
.arch-wire-branch{stroke:var(--green);stroke-width:1.25;opacity:.58}
.arch-packet{fill:var(--green)}
.arch-rows{display:grid;gap:56px;position:relative;z-index:1}
.arch-row{position:relative;display:grid;grid-template-columns:290px minmax(0,1fr);column-gap:70px;row-gap:0;align-items:start;border:1px dashed var(--rule2);background:transparent;padding:32px 18px 20px}
.arch-row.has-company-open{grid-template-columns:minmax(0,1fr);column-gap:0;row-gap:20px}
.arch-row-label{position:absolute;top:-9px;left:14px;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--card);padding:0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.arch-item{position:relative;z-index:3;min-width:0;border:1px solid var(--rule2);background:var(--card);transition:border-color .16s,box-shadow .22s,background .16s}
.arch-item:hover{border-color:var(--ink)}
.arch-item.on{border-color:var(--green);background:var(--green-bg);box-shadow:0 8px 24px rgba(31,77,58,.07)}
.arch-item-head{position:relative;width:100%;border:0;background:transparent;text-align:left;transition:background .16s,transform .16s}
.arch-item-head:hover{transform:translateY(-1px)}
.arch-item.on .arch-item-head{background:var(--green-bg)}
.arch-company-head{display:grid;grid-template-columns:72px minmax(0,1fr) 24px;gap:12px;align-items:center;padding:13px}
.arch-company-logo{width:72px;height:46px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--rule);padding:5px}
.arch-company-logo img{display:block;max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.arch-company-name,.arch-mission-name{display:block;font-weight:600;line-height:1.25}
.arch-company-name{font-family:var(--disp);font-size:18px;font-weight:520}
.arch-node-role{display:block;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--green);margin-bottom:3px;line-height:1.4}
.arch-node-when{display:block;font-family:var(--mono);font-size:9.5px;color:var(--mut);margin-top:4px;line-height:1.35}
.arch-toggle{width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--rule2);border-radius:50%;font-family:var(--mono);font-size:16px;color:var(--mut);transition:transform .2s,color .15s,border-color .15s}
.arch-item.on .arch-toggle{transform:rotate(45deg);color:var(--green);border-color:var(--green)}
.arch-item-body{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.22,.61,.36,1)}
.arch-body-in{border-top:1px solid var(--green);background:var(--card);padding:16px}
.arch-body-in p{font-size:13.5px;color:var(--ink2);margin-bottom:12px}
.arch-body-in ul{list-style:none;margin-bottom:12px}
.arch-body-in li{position:relative;padding-left:16px;margin-bottom:6px;font-size:13.5px;color:var(--ink2)}
.arch-body-in li::before{content:"—";position:absolute;left:0;color:var(--green)}
.arch-missions{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start}
.arch-missions .arch-item.on .arch-body-in{padding:20px 22px}
.arch-row.has-company-open > .arch-item.on .arch-body-in{padding:20px 22px}
.arch-row.has-company-open > .arch-item.on .arch-body-in > *{max-width:82ch}
.arch-mission-head{display:grid;grid-template-columns:28px minmax(0,1fr) 24px;gap:9px;align-items:start;padding:11px}
.arch-provider{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--rule);background:var(--paper)}
.arch-provider svg{width:17px;height:17px;display:block}
.arch-mission-name{font-size:13px}
.arch-mission-role{display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--green);margin-top:5px;line-height:1.4}
.arch-live{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--rust);text-transform:uppercase;margin-top:6px}
.arch-live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rust)}
@media(max-width:980px) and (min-width:861px){
  .arch-row{grid-template-columns:250px minmax(0,1fr);column-gap:42px}
}
@media(max-width:860px){
  .arch-intro{align-items:flex-start;flex-direction:column}
  .arch-row{grid-template-columns:1fr;column-gap:0;row-gap:0}
  .arch-row.has-company-open{row-gap:26px}
  .arch-missions{margin-top:26px}
  .arch-wires{display:none}
  .arch-row:not(:last-child)::after{content:"↑";position:absolute;left:50%;bottom:-46px;height:36px;color:var(--green);font-family:var(--mono);font-size:18px;line-height:36px}
  .arch-missions{border-left:1px solid var(--green);padding-left:14px}
}
@media(max-width:430px){
  .arch-company-head{grid-template-columns:58px minmax(0,1fr) 24px;gap:9px;padding:10px}
  .arch-company-logo{width:58px;height:40px}
}
@media(prefers-reduced-motion:reduce){
  .tabs button,.arch-item,.arch-item-head,.arch-toggle,.arch-item-body{transition:none}
}

/* ── détail commun ── */
.dt-h{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.dt-h h3{font-family:var(--disp);font-size:20px;font-weight:520;letter-spacing:-.005em}
.dt-when{font-family:var(--mono);font-size:11.5px;color:var(--rust);padding-top:6px;white-space:nowrap}
.dt-role{font-family:var(--mono);font-size:12px;color:var(--green);margin-bottom:14px}
.dt-intro{font-size:14.5px;color:var(--ink2);margin-bottom:13px;max-width:78ch}
.dt ul,.inline-detail ul{list-style:none;margin-bottom:13px}
.dt li,.inline-detail li{position:relative;padding-left:18px;margin-bottom:7px;font-size:14.5px;color:var(--ink2)}
.dt li::before,.inline-detail li::before{content:"—";position:absolute;left:0;color:var(--green)}
.stackline{font-family:var(--mono);font-size:11.5px;color:var(--mut);line-height:1.8}
.stackline b{color:var(--ink2);font-weight:500}

/* ── chronologie par employeur ── */
.emp{border:1px solid var(--rule2);background:var(--card);margin-bottom:26px}
.emp:last-child{margin-bottom:0}
.emp-head{width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding:20px 24px;text-align:left}
.emp-head:hover .emp-n{color:var(--green)}
.emp-n{display:block;font-family:var(--disp);font-size:23px;font-weight:520;letter-spacing:-.008em;transition:color .15s}
.emp-sub{display:block;font-family:var(--mono);font-size:11.5px;color:var(--mut);margin-top:3px}
.emp-sub .rl{color:var(--green)}
.emp-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.emp-when{font-family:var(--mono);font-size:11.5px;color:var(--rust);white-space:nowrap;display:block}
.emp-x{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--rule2);border-radius:50%;background:var(--paper);
  font-family:var(--mono);font-size:22px;line-height:1;color:var(--mut);
  transition:transform .18s,color .15s,border-color .15s,background .15s}
.emp-head:hover .emp-x{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.emp.on .emp-x{transform:rotate(45deg);color:var(--green);border-color:var(--green);background:var(--green-bg)}
.emp-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.emp-body-in{padding:0 24px 20px;border-bottom:1px dashed var(--rule)}
.emp-body-in .dt-intro{border-left:2px solid var(--green-bg);padding-left:14px}
.emp-missions{padding:16px 24px 22px 24px}
.emp-missions .mlabel{display:block;text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}
.entry{position:relative;padding-left:30px;margin-bottom:6px}
.entry:last-child{margin-bottom:0}
.entry::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--rule2)}
.entry::after{content:"";position:absolute;left:8px;top:23px;width:16px;height:1px;background:var(--rule2)}
.entry:last-child::before{bottom:auto;height:23px}
.e-card{border:1px solid transparent;transition:.14s;background:var(--paper)}
.e-card:hover{border-color:var(--rule)}
.e-card.on{border-color:var(--rule2)}
.e-btn{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;width:100%;padding:10px 14px;text-align:left}
.e-when{font-family:var(--mono);font-size:11px;color:var(--rust);display:block;margin-bottom:2px}
.e-t{font-size:15.5px;font-weight:600;letter-spacing:-.005em;display:block}
.e-c{font-family:var(--mono);font-size:11px;color:var(--mut);display:block;margin-top:1px}
.e-logo{width:26px;height:26px;border:1px solid var(--rule);background:var(--card);display:grid;place-items:center;flex-shrink:0;margin-top:3px}
.e-logo svg{width:15px;height:15px;display:block}
.e-txt{flex:1;min-width:0}
.e-x{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:50%;background:var(--card);
  font-family:var(--mono);font-size:18px;line-height:1;color:var(--mut);flex-shrink:0;
  transition:transform .18s,color .15s,border-color .15s,background .15s}
.e-btn:hover .e-x{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.e-card.on .e-x{transform:rotate(45deg);color:var(--green);border-color:var(--green);background:var(--green-bg)}
.e-body{max-height:0;overflow:hidden;transition:max-height .26s ease}
.e-body-in{margin:0 14px 14px;padding:14px 0 0 18px;border-left:2px solid var(--green-bg);border-top:1px dashed var(--rule)}

/* ── compétences ── */
.skrow{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--rule)}
.skrow:last-child{border-bottom:none}
.skrow dt{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding-top:3px}
.skrow dd .main{font-size:15px;font-weight:500}
.skrow dd .main b{font-weight:600}
.skrow dd .lvl{font-family:var(--mono);font-size:11px;color:var(--faint)}
.skitem{margin-bottom:6px}
.skitem:last-child{margin-bottom:0}
.skinline{font-size:14.5px;color:var(--ink2)}

/* ── certifications ── */
.certcols{columns:2;column-gap:52px}
.crow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule);break-inside:avoid}
.crow .clogo{width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:3px}
.crow .clogo svg{width:18px;height:18px;display:block}
.crow .cn{min-width:0}
.crow .nm{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.005em;line-height:1.3}
.crow .lv{display:block;font-family:var(--mono);font-size:11px;color:var(--mut)}
.crow .sp{flex:1;height:14px;border-bottom:1px dotted var(--rule2);min-width:18px}
.crow a.vf{font-family:var(--mono);font-size:11.5px;color:var(--green);text-decoration:none;white-space:nowrap;padding-top:1px}
.crow a.vf:hover{text-decoration:underline}
.crow .vn{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;padding-top:2px}

/* ── formation ── */
.edrow{display:grid;grid-template-columns:200px 1fr auto;gap:20px;padding:15px 0;border-bottom:1px solid var(--rule)}
.edrow:last-child{border-bottom:none}
.edrow .y{font-family:var(--mono);font-size:12px;color:var(--rust);padding-top:2px}
.edrow h4{font-size:16px;font-weight:600;letter-spacing:-.005em}
.edrow p{font-size:13.5px;color:var(--mut)}
.edlogo{align-self:center;display:flex;justify-content:flex-end}
/* multiply : fond blanc des logos fournis en PNG fondu dans le papier ;
   largeur fixée par CONFIG.edu pour une taille commune */
.edlogo img{display:block;height:auto;mix-blend-mode:multiply}

/* ── contact ── */
.contact h3{font-family:var(--disp);font-weight:470;font-size:clamp(28px,4vw,42px);letter-spacing:-.01em;margin-bottom:10px}

/* durée depuis une date "YYYY-MM", comptée en mois inclusifs
   (mar 2024 → mar 2026 = « 2 ans 1 mois ») — l'affichage du poste
   en cours reste juste sans retoucher le CONFIG chaque mois. */
function dur(since){
  const [y,m]=since.split('-').map(Number), now=new Date();
  let n=(now.getFullYear()-y)*12+now.getMonth()+1-m+1;
  if(n<1)n=1;
  const yr=Math.floor(n/12), mo=n%12, fr=LANG==='fr', out=[];
  if(yr)out.push(yr+(fr?(yr>1?' ans':' an'):(yr>1?' yrs':' yr')));
  if(mo)out.push(mo+(fr?' mois':(mo>1?' mos':' mo')));
  return out.join(' ');
}

    <ul>${o.bullets[LANG].map(b=>`<li>${b}</li>`).join('')}</ul>${stackHTML(o)}`;
}

/* ── schéma vertical du parcours ── */
const COMPANY_LOGOS={
  devoteam:{src:"https://upload.wikimedia.org/wikipedia/commons/7/79/Dev_logo_rgb.png",alt:"Devoteam"},
  hardis:{src:"https://upload.wikimedia.org/wikipedia/commons/8/87/Logo_HG_Generic_RGB.svg",alt:"Hardis Group"},
  also:{src:"https://upload.wikimedia.org/wikipedia/commons/f/fd/ALSO_Holding_AG_Logo_2020.svg",alt:"ALSO Group"}
};
let ARCHEXPANDED=null,ARCHOBSERVER=null,ARCHDRAWRAF=null,ARCHLAYOUTRAF=null,ARCHPACKETRAF=null,ARCHPACKETLAST=0;

function archBodyHTML(item){
  const bullets=item.bullets&&item.bullets[LANG]?item.bullets[LANG]:[];
  return `${item.intro?`<p>${pick(item.intro)}</p>`:''}
    <ul>${bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
    ${stackHTML(item)}`;
}
function makeArchItem(type,id,item,headHTML,headClass){
  const article=document.createElement('article');
  article.className='arch-item';
  article.dataset.type=type;
  article.dataset.id=id;
  article.innerHTML=`<button class="arch-item-head ${headClass}" type="button" aria-expanded="false">
      ${headHTML}<span class="arch-toggle" aria-hidden="true">+</span>
    </button>
    <div class="arch-item-body"><div class="arch-body-in">${archBodyHTML(item)}</div></div>`;
  const body=article.querySelector('.arch-item-body');
  initBody(body,false);
  article.querySelector('.arch-item-head').addEventListener('click',()=>toggleArchItem(type,id));
  body.addEventListener('transitionend',()=>drawArchWires());
  return article;
}
function syncCompanyLayout(){
  const delay=matchMedia('(prefers-reduced-motion: reduce)').matches?0:400;
  document.querySelectorAll('.arch-row').forEach(row=>{
    clearTimeout(row._archLayoutTimer);
    const company=row.querySelector(':scope > .arch-item[data-type="company"]');
    if(company&&company.classList.contains('on')){row.classList.add('has-company-open');return;}
    if(!row.classList.contains('has-company-open'))return;
    row._archLayoutTimer=setTimeout(()=>{
      if(company&&company.classList.contains('on'))return;
      row.classList.remove('has-company-open');trackArchLayout(260);
    },delay);
  });
}
function toggleArchItem(type,id){
  const same=ARCHEXPANDED&&ARCHEXPANDED.type===type&&ARCHEXPANDED.id===id;
  ARCHEXPANDED=same?null:{type,id};
  document.querySelectorAll('.arch-item').forEach(item=>{
    const open=!!ARCHEXPANDED&&item.dataset.type===ARCHEXPANDED.type&&item.dataset.id===ARCHEXPANDED.id;
    item.classList.toggle('on',open);
    item.querySelector('.arch-item-head').setAttribute('aria-expanded',open?'true':'false');
    setBody(item.querySelector('.arch-item-body'),open);
  });
  syncCompanyLayout();
  trackArchLayout(420);
}
function archZoneLocation(company){
  return pick(company.loc).replace(/\s*·\s*(hybride|hybrid)$/i,'');
}
function renderArch(){
  ARCHEXPANDED=null;
  const root=$('#arch-root');
  root.innerHTML='';
  CONFIG.companies.forEach((co,index)=>{
    const missions=CONFIG.missions.filter(m=>m.company===co.id)
      .sort((a,b)=>(a.displayOrder??99)-(b.displayOrder??99));
    const row=document.createElement('div');
    row.className='arch-row';
    row.dataset.company=co.id;
    const zoneLabel=`${t('arch_zone')} ${co.name} · ${archZoneLocation(co)}`;
    row.innerHTML=`<span class="arch-row-label" title="${zoneLabel}">${zoneLabel}</span>`;

    const logo=COMPANY_LOGOS[co.id];
    const companyHead=`<span class="arch-company-logo"><img src="${logo.src}" alt="${logo.alt}" loading="lazy" decoding="async" referrerpolicy="no-referrer"></span>
      <span><span class="arch-node-role">${pick(co.role)} · ${pick(co.contract)}</span><strong class="arch-company-name">${co.name}</strong>
      <span class="arch-node-when">${whenStr(co)}</span>
      ${co.live?`<span class="arch-live">${t('current')}</span>`:''}</span>`;
    row.appendChild(makeArchItem('company',co.id,co,companyHead,'arch-company-head'));

    if(missions.length){
      const missionRoot=document.createElement('div');
      missionRoot.className='arch-missions';
      missions.forEach(m=>{
        const missionHead=`<span class="arch-provider">${LOGOS[m.cloud]||LOGOS.oth}</span>
          <span><strong class="arch-mission-name">${pick(m.card)}</strong>
          <span class="arch-mission-role">${pick(m.role)}</span>
          <span class="arch-node-when">${pick(m.when)}</span>
          ${m.live?`<span class="arch-live">${t('current')}</span>`:''}</span>`;
        missionRoot.appendChild(makeArchItem('mission',m.id,m,missionHead,'arch-mission-head'));
      });
      row.appendChild(missionRoot);
    }
    root.appendChild(row);
  });
  requestAnimationFrame(drawArchWires);
  if('ResizeObserver' in window){
    if(ARCHOBSERVER)ARCHOBSERVER.disconnect();
    ARCHOBSERVER=new ResizeObserver(scheduleArchWires);
    ARCHOBSERVER.observe($('#arch-canvas'));
  }
}
function archPoint(el,side,base){
  const r=el.getBoundingClientRect();
  if(side==='right')return{x:r.right-base.left,y:r.top+r.height/2-base.top};
  if(side==='left')return{x:r.left-base.left,y:r.top+r.height/2-base.top};
  if(side==='bottom')return{x:r.left+r.width/2-base.left,y:r.bottom-base.top};
  return{x:r.left+r.width/2-base.left,y:r.top-base.top};
}
function archMainPoint(el,side,base){
  const r=el.getBoundingClientRect(),columnWidth=matchMedia('(max-width:980px)').matches?250:290;
  const point={x:r.left+Math.min(columnWidth,r.width)/2-base.left,y:r.top-base.top};
  if(side==='bottom')point.y=r.bottom-base.top;
  return point;
}
const ARCH_NS='http://www.w3.org/2000/svg',ARCH_PACKET_SPEED=54;
function ensureArchDefs(svg){
  if(svg.querySelector('#arch-arrow'))return;
  const defs=document.createElementNS(ARCH_NS,'defs');
  defs.innerHTML='<marker id="arch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--green)"/></marker>';
  svg.prepend(defs);
}
function syncArchWire(svg,key,d,main,index,alive){
  alive.add(key);
  let group=[...svg.querySelectorAll('.arch-wire-set')].find(node=>node.dataset.key===key);
  if(!group){
    group=document.createElementNS(ARCH_NS,'g');
    group.setAttribute('class','arch-wire-set');
    group.dataset.key=key;
    const path=document.createElementNS(ARCH_NS,'path');
    path.setAttribute('class','arch-wire '+(main?'arch-wire-main':'arch-wire-branch'));
    path.setAttribute('marker-end','url(#arch-arrow)');
    group.appendChild(path);
    svg.appendChild(group);
  }
  group.querySelector('.arch-wire').setAttribute('d',d);
  let packet=group.querySelector('.arch-packet');
  if(main||matchMedia('(prefers-reduced-motion: reduce)').matches){if(packet)packet.remove();return;}
  if(!packet){
    packet=document.createElementNS(ARCH_NS,'circle');
    packet.setAttribute('class','arch-packet');packet.setAttribute('r','2.3');
    packet.dataset.seed=String(index*43);group.appendChild(packet);
  }
}
function scheduleArchWires(){
  if(ARCHDRAWRAF)return;
  ARCHDRAWRAF=requestAnimationFrame(()=>{ARCHDRAWRAF=null;drawArchWires();});
}
function trackArchLayout(duration=460){
  if(ARCHLAYOUTRAF)cancelAnimationFrame(ARCHLAYOUTRAF);
  const started=performance.now();
  const follow=now=>{
    drawArchWires();
    if(now-started<duration)ARCHLAYOUTRAF=requestAnimationFrame(follow);
    else{ARCHLAYOUTRAF=null;drawArchWires();}
  };
  ARCHLAYOUTRAF=requestAnimationFrame(follow);
}
function ensureArchPacketAnimation(){
  if(ARCHPACKETRAF||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  ARCHPACKETLAST=0;
  ARCHPACKETRAF=requestAnimationFrame(animateArchPackets);
}
function animateArchPackets(now){
  ARCHPACKETRAF=null;
  const canvas=$('#arch-canvas'),svg=$('#arch-wires');
  if(!canvas||!svg||!canvas.getClientRects().length||matchMedia('(prefers-reduced-motion: reduce)').matches){ARCHPACKETLAST=0;return;}
  const dt=ARCHPACKETLAST?Math.min((now-ARCHPACKETLAST)/1000,.05):0;
  ARCHPACKETLAST=now;
  const packets=[...svg.querySelectorAll('.arch-packet')];
  packets.forEach(packet=>{
    const path=packet.parentNode.querySelector('.arch-wire');
    const length=path.getTotalLength();
    if(!length)return;
    const previousLength=Number(packet.dataset.pathLength)||length;
    let distance=packet.dataset.distance===undefined?(Number(packet.dataset.seed)||0)%length:Number(packet.dataset.distance);
    if(previousLength!==length)distance=distance/previousLength*length;
    distance=(distance+ARCH_PACKET_SPEED*dt)%length;
    const point=path.getPointAtLength(distance);
    packet.setAttribute('cx',point.x);
    packet.setAttribute('cy',point.y);
    packet.dataset.distance=String(distance);
    packet.dataset.pathLength=String(length);
  });
  if(packets.length)ARCHPACKETRAF=requestAnimationFrame(animateArchPackets);
}
function drawArchWires(){
  const canvas=$('#arch-canvas'),svg=$('#arch-wires');
  if(!canvas||!svg)return;
  if(matchMedia('(max-width:860px)').matches){svg.replaceChildren();return;}
  const base=canvas.getBoundingClientRect();
  if(base.width<2||base.height<2)return;
  svg.setAttribute('viewBox',`0 0 ${base.width} ${base.height}`);
  ensureArchDefs(svg);
  const alive=new Set(),companies=[...canvas.querySelectorAll('.arch-company-head')];
  companies.forEach((newer,index)=>{
    const companyId=newer.closest('.arch-row').dataset.company;
    if(index<companies.length-1){
      const older=companies[index+1],olderId=older.closest('.arch-row').dataset.company;
      const a=archMainPoint(older,'top',base),b=archMainPoint(newer,'bottom',base),mid=(a.y+b.y)/2;
      syncArchWire(svg,`main:${olderId}:${companyId}`,`M${a.x} ${a.y}V${mid}H${b.x}V${b.y}`,true,index,alive);
    }
    const row=newer.closest('.arch-row');
    row.querySelectorAll('.arch-mission-head').forEach((mission,missionIndex)=>{
      const missionId=mission.closest('.arch-item').dataset.id;
      const a=archPoint(newer,'right',base),b=archPoint(mission,'left',base),mid=(a.x+b.x)/2;
      syncArchWire(svg,`branch:${companyId}:${missionId}`,`M${a.x} ${a.y}H${mid}V${b.y}H${b.x}`,false,index*6+missionIndex,alive);
    });
  });
  svg.querySelectorAll('.arch-wire-set').forEach(group=>{if(!alive.has(group.dataset.key))group.remove();});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)svg.querySelectorAll('.arch-packet').forEach(packet=>packet.remove());
  else ensureArchPacketAnimation();
}

/* ── dépliage animé ──
   Une fois ouvert, le bloc repasse en max-height:none : il suit alors les
   reflows (resize, chargement des polices, onglet masqué) sans recalcul. */
function initBody(el,open){
  el.dataset.open=open?'1':'0';
  el.style.maxHeight=open?'none':'0px';
  el.addEventListener('transitionend',ev=>{
    if(ev.target===el&&ev.propertyName==='max-height'&&el.dataset.open==='1')el.style.maxHeight='none';
  });
}
function setBody(el,open){
  if(el.dataset.open===(open?'1':'0'))return;
  if(open){el.dataset.open='1';el.style.maxHeight=el.scrollHeight+'px';return;}
  el.style.maxHeight=el.scrollHeight+'px';   /* fige la hauteur avant l'animation */
  void el.offsetHeight;
  el.dataset.open='0';
  requestAnimationFrame(()=>{if(el.dataset.open==='0')el.style.maxHeight='0px';});
}

/* ── chronologie par employeur ── */
function renderChrono(){
  const root=$('#tl-root');root.innerHTML='';
  CONFIG.companies.forEach(co=>{
    const emp=document.createElement('div');emp.className='emp';
    emp.innerHTML=`<button class="emp-head" aria-expanded="true">
        <span><span class="emp-n">${co.name}</span>
          <span class="emp-sub"><span class="rl">${pick(co.role)}</span> · ${pick(co.contract)} · ${pick(co.loc)}</span></span>
        <span class="emp-right"><span class="emp-when">${whenStr(co)}</span><span class="emp-x">+</span></span>
      </button>
      <div class="emp-body"><div class="emp-body-in dt">
        <p class="dt-intro">${pick(co.intro)}</p>
        <ul>${co.bullets[LANG].map(b=>`<li>${b}</li>`).join('')}</ul>
        ${stackHTML(co)}
      </div></div>`;
    /* le poste lui-même (intro + missions du poste) est déplié d'entrée :
       c'est le contenu principal, les missions clients restent repliées. */
    const body=emp.querySelector('.emp-body'), head=emp.querySelector('.emp-head');
    emp.classList.add('on');
    initBody(body,true);
    head.addEventListener('click',()=>{
      const open=!emp.classList.contains('on');
      emp.classList.toggle('on',open);
      head.setAttribute('aria-expanded',open);
      setBody(body,open);
      syncXall();
    });
    const ms=CONFIG.missions.filter(m=>m.company===co.id)
      .sort((a,b)=>(a.displayOrder??99)-(b.displayOrder??99));
    if(ms.length){
      const zone=document.createElement('div');zone.className='emp-missions';
      zone.innerHTML=`<span class="mlabel">${t('missions_lbl')}</span>`;
      ms.forEach(m=>{
        const e=document.createElement('div');e.className='entry';
        const card=document.createElement('div');card.className='e-card';
        card.innerHTML=`<button class="e-btn" aria-expanded="false"><span class="e-logo">${LOGOS[m.cloud]||LOGOS.oth}</span><span class="e-txt">
            <span class="e-when">${whenStr(m)}</span>
            <span class="e-t">${pick(m.title)}</span>
            <span class="e-c">${pick(m.role)}</span>
          </span><span class="e-x">+</span></button>
          <div class="e-body"><div class="e-body-in dt">
            ${m.intro?`<p class="dt-intro">${pick(m.intro)}</p>`:''}
            <ul>${m.bullets[LANG].map(b=>`<li>${b}</li>`).join('')}</ul>${stackHTML(m)}
          </div></div>`;
        const bd=card.querySelector('.e-body'), btn=card.querySelector('.e-btn');
        initBody(bd,false);
        btn.addEventListener('click',()=>{
          const open=!card.classList.contains('on');
          card.classList.toggle('on',open);
          btn.setAttribute('aria-expanded',open);
          setBody(bd,open);
          syncXall();
        });
        e.appendChild(card);zone.appendChild(e);
      });
      emp.appendChild(zone);
    }
    root.appendChild(emp);
  });
}

/* ── tout déplier ── */
function updateXall(){$('#xall').textContent=ALLOPEN?t('xall_close'):t('xall_open');}
function syncXall(){
  const all=[...document.querySelectorAll('.e-card'),...document.querySelectorAll('.emp')];
  ALLOPEN=all.length>0&&all.every(c=>c.classList.contains('on'));
  updateXall();
}
function toggleAll(){
  ALLOPEN=!ALLOPEN;
  document.querySelectorAll('.emp').forEach(emp=>{
    emp.classList.toggle('on',ALLOPEN);
    emp.querySelector('.emp-head').setAttribute('aria-expanded',ALLOPEN);
    setBody(emp.querySelector('.emp-body'),ALLOPEN);
  });
  document.querySelectorAll('.e-card').forEach(c=>{
    c.classList.toggle('on',ALLOPEN);
    c.querySelector('.e-btn').setAttribute('aria-expanded',ALLOPEN);
    setBody(c.querySelector('.e-body'),ALLOPEN);
  });
  updateXall();
}

function setView(v){
  const arch=v==='arch',archTab=$('#tab-arch'),chronoTab=$('#tab-chrono');
  archTab.classList.toggle('on',arch);chronoTab.classList.toggle('on',!arch);
  archTab.setAttribute('aria-selected',arch?'true':'false');chronoTab.setAttribute('aria-selected',arch?'false':'true');
  archTab.tabIndex=arch?0:-1;chronoTab.tabIndex=arch?-1:0;
  $('#view-arch').classList.toggle('on',arch);$('#view-chrono').classList.toggle('on',!arch);
  $('#view-arch').setAttribute('aria-hidden',arch?'false':'true');
  $('#view-chrono').setAttribute('aria-hidden',arch?'true':'false');
  $('#xall').style.display=v==='chrono'?'block':'none';
  if(v==='arch')requestAnimationFrame(drawArchWires);
}
$('.tabs').addEventListener('keydown',event=>{
  if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;
  event.preventDefault();
  const view=document.activeElement.id==='tab-arch'?'chrono':'arch';
  setView(view);$(`#tab-${view}`).focus();
});
function setLang(l,remember){
  if(remember){try{localStorage.setItem('lang',l)}catch(e){}}
  LANG=l;ALLOPEN=false;
  renderStatic();renderArch();renderChrono();renderSkills();renderCerts();renderEdu();
}

/* Langue initiale : choix mémorisé, sinon langue du navigateur —
   un visiteur non francophone (donc a priori hors de France) démarre
   en anglais, un navigateur en français garde le français. */
let initLang=null;
try{initLang=localStorage.getItem('lang')}catch(e){}
if(initLang!=='fr'&&initLang!=='en'){
  const nav=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'fr'];
  initLang=nav.some(l=>/^fr/i.test(l))?'fr':'en';
}
setLang(initLang);
